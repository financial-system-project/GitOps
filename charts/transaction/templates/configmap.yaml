apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "transaction-service.fullname" . }}-config
  namespace: {{ .Values.Namespace }}
data:
  DB_HOST: {{ .Values.database.host }}
  DB_PORT: "{{ .Values.database.port }}"
  SPRING_PROFILES_ACTIVE: "k8s"
  LOGSTASH_HOST: {{ .Values.elk.logstashHost | quote }}