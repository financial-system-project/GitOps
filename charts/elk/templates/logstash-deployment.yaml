apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elk.logstash.fullname" . }}
  namespace: {{ .Values.Namespace }}
  labels:
    app: logstash
    {{- include "elk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.logstash.replicas }}
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: "{{ .Values.logstash.image.repository }}:{{ .Values.logstash.image.tag }}"
          ports:
            - containerPort: {{ .Values.logstash.tcpPort }}
              name: tcp-input
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
          resources:
            {{- toYaml .Values.logstash.resources | nindent 12 }}
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
          readinessProbe:
            tcpSocket:
              port: {{ .Values.logstash.tcpPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.logstash.tcpPort }}
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline
