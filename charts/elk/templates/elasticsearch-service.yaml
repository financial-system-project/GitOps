apiVersion: v1
kind: Service
metadata:
  name: {{ include "elk.elasticsearch.fullname" . }}
  namespace: {{ .Values.Namespace }}
  labels:
    app: elasticsearch
    {{- include "elk.labels" . | nindent 4 }}
spec:
  clusterIP: None   # headless — StatefulSet uses DNS for peer discovery
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
