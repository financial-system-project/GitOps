replicaCount: 2

image:
  repository: user-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "user-service-role"
  vault.hashicorp.com/agent-inject-secret-db-creds: "secret/user-service/db-creds"
  vault.hashicorp.com/agent-inject-template-db-creds: |
    {{- with secret "secret/user-service/db-creds" -}}
    export SPRING_DATASOURCE_USERNAME="{{ .Data.data.DB_USER }}"
    export SPRING_DATASOURCE_PASSWORD="{{ .Data.data.DB_PASSWORD }}"
    {{- end }}
  vault.hashicorp.com/agent-inject-command: |
    #!/bin/sh
    set -e
    source /vault/secrets/db-creds
    java -jar /app/app.jar

service:
  type: ClusterIP
  port: 8080

Namespace: bank-app-dev

serviceAccount:
  name: user-service

database:
  host: user-service-postgres
  port: 5432
  name: userdb

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
  storage:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 5