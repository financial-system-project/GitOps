replicaCount: 2

image:
  repository: mahendra3/user
  tag: "35"
  pullPolicy: IfNotPresent

vault:
  enabled: true

  server: "http://vault-app.vault:8200"

  secretPath: "bank-app/db"

externalSecret:
  refreshInterval: "1m"

service:
  type: ClusterIP
  port: 8080

Namespace: bank-app-dev

serviceAccount:
  name: user-service

database:
  host: user-service-postgres
  port: 5432
  name: userdb

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
  storage:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 5